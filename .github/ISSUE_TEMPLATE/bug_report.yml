name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, what you got instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: Minimal steps, code, or input to reproduce.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      placeholder: OS, compiler/runtime and version
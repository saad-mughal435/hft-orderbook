name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-test:
    name: build + test (ubuntu, g++)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build -j

      - name: Test
        run: ctest --test-dir build --output-on-failure

      - name: Replay smoke (synthetic stream)
        run: ./build/obreplay --synthetic 50000

      - name: Replay smoke (multi-symbol, sharded)
        run: ./build/obreplay --synthetic 50000 --symbols 16 --threads 4 > /dev/null

      - name: Replay smoke (generated capture file)
        run: |
          ./build/gencap 20000 /tmp/synth.itch
          ./build/obreplay /tmp/synth.itch

      - name: FIX codec smoke
        run: ./build/fixsim

      - name: MoldUDP64 receiver smoke
        run: ./build/mdrecv --self 20000

      - name: Record book replay (real engine output, for the static viewer)
        run: ./build/wsbook --dump 72 --synthetic 7200 > book-replay.ndjson

      - name: Upload replay artifact
        uses: actions/upload-artifact@v7
        with:
          name: book-replay
          path: book-replay.ndjson

  benchmarks:
    name: benchmarks (smoke)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Configure (benchmarks on, tests off)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DHFTOB_BUILD_BENCH=ON -DHFTOB_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build -j

      - name: Run benchmark smoke (tiny time budget)
        run: ./build/hftob_bench --benchmark_min_time=0.02s

      - name: Per-message-type decode-to-book latency histogram (JSON)
        run: |
          # Stamp the real CI run time (UTC, ISO-8601) into the document.
          export HFTOB_GENERATED_AT="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          ./build/latency_json 200000 latency.json
          cat latency.json

      - name: Upload latency histogram artifact
        uses: actions/upload-artifact@v7
        with:
          name: latency-histogram
          path: latency.json

  sanitizers:
    name: sanitizers (${{ matrix.san }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - san: thread
            flags: "-fsanitize=thread -fno-omit-frame-pointer -g -O1"
          - san: address-undefined
            flags: "-fsanitize=address,undefined -fno-sanitize-recover=undefined -fno-omit-frame-pointer -g -O1"
    steps:
      - uses: actions/checkout@v7

      - name: Configure (${{ matrix.san }})
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DCMAKE_CXX_FLAGS="${{ matrix.flags }}"

      - name: Build
        run: cmake --build build -j

      - name: Test under sanitizer
        run: ctest --test-dir build --output-on-failure

      - name: Replay smoke under sanitizer
        run: ./build/obreplay --synthetic 20000 > /dev/null

      - name: Sharded replay smoke under sanitizer
        run: ./build/obreplay --synthetic 20000 --symbols 12 --threads 4 > /dev/null

  warnings:
    name: clang -Werror (lib + apps)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7

      - name: Configure (clang, -Werror, tests/bench off)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DHFTOB_BUILD_TESTS=OFF -DHFTOB_BUILD_BENCH=OFF
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Wpedantic -Werror"

      - name: Build
        run: cmake --build build -j

  fuzz:
    name: fuzz (decode, libFuzzer)
    runs-on: ubuntu-latest
    env:
      CC: clang
      CXX: clang++
    steps:
      - uses: actions/checkout@v7

      - name: Configure (fuzz on, clang)
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
          -DHFTOB_BUILD_FUZZ=ON -DHFTOB_BUILD_TESTS=OFF -DHFTOB_BUILD_BENCH=OFF

      - name: Build
        run: cmake --build build -j

      - name: Seed corpus + fuzz (short session)
        run: |
          mkdir -p corpus
          ./build/gencap 3000 corpus/seed.itch
          ./build/decode_fuzz -max_total_time=25 -runs=300000 corpus
